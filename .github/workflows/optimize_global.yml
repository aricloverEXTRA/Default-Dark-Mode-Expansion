name: 🌐 Optimize All PNGs (Global — aricloverEXTRA only)

on:
  workflow_dispatch:

concurrency:
  group: optimize-global
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: 🌐 Optimize All PNGs (Global)
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📦 Install oxipng
        uses: baptiste0928/cargo-install@v3
        with:
          crate: oxipng
          version: latest

      - name: 🔍 Find PNGs touched by aricloverEXTRA (exclude NebuIr)
        id: find
        run: |
          set -e
          # Collect all PNGs ever added/modified/renamed by you.
          # We match both author and committer, and both your handles.
          > /tmp/touched.txt
          for pattern in "aricloverEXTRA" "aric3435" "Aric3435" "ariclover"; do
            git log --all --author="$pattern" --name-only --pretty=format: --diff-filter=AMR | grep -Ei '\.png$' >> /tmp/touched.txt || true
            git log --all --committer="$pattern" --name-only --pretty=format: --diff-filter=AMR | grep -Ei '\.png$' >> /tmp/touched.txt || true
          done
          # Also include NebuIr exclusion check: remove any file that was ONLY touched by NebuIr
          # Since we only collected your touches, NebuIr-only files are already excluded.
          sort -u /tmp/touched.txt -o /tmp/touched.txt
          echo "Raw touched count: $(wc -l < /tmp/touched.txt)"

          # Keep only files that still exist on disk
          > /tmp/existing.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -f "$f" ]; then
              echo "$f" >> /tmp/existing.txt
            fi
          done < /tmp/touched.txt

          sort -u /tmp/existing.txt -o /tmp/existing.txt
          COUNT=$(wc -l < /tmp/existing.txt | tr -d ' ')
          echo "Existing PNGs touched by you: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            head -n 50 /tmp/existing.txt
            [ "$COUNT" -gt 50 ] && echo "... and $((COUNT-50)) more"
          else
            echo "No PNGs found for aricloverEXTRA — nothing to do."
          fi

          # Export for next steps
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "files<<$EOF" >> $GITHUB_OUTPUT
          cat /tmp/existing.txt >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT

          # Save null-separated for xargs
          tr '\n' '\0' < /tmp/existing.txt > /tmp/existing0.txt || true

      - name: ⚡ Optimize PNG files (global)
        if: steps.find.outputs.count != '0'
        run: |
          echo "Optimizing $(wc -l < /tmp/existing.txt) files..."
          cat /tmp/existing.txt | tr '\n' '\0' | xargs -0 -r oxipng -o 3 -i off --strip safe
          echo "Done."

      - name: 🧾 Get optimized files
        id: optimized
        if: steps.find.outputs.count != '0'
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "all_optimized_files<<$EOF" >> $GITHUB_OUTPUT
          echo "$(git status --porcelain | sed s/^...//)" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
          git status --porcelain | head -n 100 || true

      - name: 📋 Generate affected folders report (global)
        if: steps.find.outputs.count != '0'
        run: |
          mkdir -p /tmp/report
          git status --porcelain | sed 's/^...//' | grep -Ei '\.png$' > /tmp/optimized.txt || true
          > /tmp/optimized-folders.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [[ "$f" == assets_1.21/assets/* ]]; then
              echo "$f" | cut -d'/' -f1-3 >> /tmp/optimized-folders.txt
            elif [[ "$f" == assets/* ]]; then
              echo "$f" | cut -d'/' -f1-2 >> /tmp/optimized-folders.txt
            else
              dirname "$f" >> /tmp/optimized-folders.txt
            fi
          done < /tmp/optimized.txt
          sort -u /tmp/optimized-folders.txt -o /tmp/optimized-folders.txt || true
          > /tmp/candidate-folders.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [[ "$f" == assets_1.21/assets/* ]]; then
              echo "$f" | cut -d'/' -f1-3 >> /tmp/candidate-folders.txt
            elif [[ "$f" == assets/* ]]; then
              echo "$f" | cut -d'/' -f1-2 >> /tmp/candidate-folders.txt
            else
              dirname "$f" >> /tmp/candidate-folders.txt
            fi
          done < /tmp/existing.txt
          sort -u /tmp/candidate-folders.txt -o /tmp/candidate-folders.txt || true
          {
            echo "# Global Optimize — Affected Folders Report"
            echo ""
            echo "**Run:** ${{ github.run_number }} | **Branch:** ${{ github.ref_name }} | **Commit:** ${{ github.sha }}"
            echo ""
            echo "## Candidate PNGs (touched by aricloverEXTRA, existing) — $(wc -l < /tmp/existing.txt) files"
            echo '```'
            head -n 200 /tmp/existing.txt || echo "(none)"
            [ "$(wc -l < /tmp/existing.txt)" -gt 200 ] && echo "... truncated"
            echo '```'
            echo ""
            echo "## Candidate asset folders — $(wc -l < /tmp/candidate-folders.txt) folders"
            echo '```'
            cat /tmp/candidate-folders.txt || echo "(none)"
            echo '```'
            echo ""
            echo "## Actually optimized PNGs — $(wc -l < /tmp/optimized.txt) files"
            echo '```'
            cat /tmp/optimized.txt || echo "(none)"
            echo '```'
            echo ""
            echo "## Optimized asset folders — $(wc -l < /tmp/optimized-folders.txt) folders"
            echo '```'
            cat /tmp/optimized-folders.txt || echo "(none)"
            echo '```'
          } > /tmp/report/affected-folders.md
          cat /tmp/report/affected-folders.md
          cp /tmp/existing.txt /tmp/report/candidate-pngs.txt 2>/dev/null || true
          cp /tmp/candidate-folders.txt /tmp/report/ 2>/dev/null || true
          cp /tmp/optimized.txt /tmp/report/optimized-pngs.txt 2>/dev/null || true
          cp /tmp/optimized-folders.txt /tmp/report/ 2>/dev/null || true
          cat /tmp/report/affected-folders.md >> $GITHUB_STEP_SUMMARY || true

      - name: 📦 Upload affected folders artifact (global)
        if: steps.find.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: affected-folders-global-${{ github.run_number }}
          path: /tmp/report/
          retention-days: 14

      - name: ⬆️ Commit and push
        if: steps.optimized.outputs.all_optimized_files != ''
        uses: planetscale/ghcommit-action@v0.2.22
        with:
          commit_message: ':zap: Optimize PNG files (global — aricloverEXTRA only)'
          file_pattern: ${{ steps.optimized.outputs.all_optimized_files }}
